.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin:2px 0 8px;font-size:.92em}.crumb{padding:6px 10px;border-radius:999px;font-weight:700;color:var(--ac)}.crumb:hover{background:var(--sf2)}.csep{color:var(--mut)}.fttl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px}.fttl b{font-size:1.5em;font-weight:800;letter-spacing:-.03em;overflow-wrap:anywhere}.fmb2{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sf2)}.fnote{padding:8px 4px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin:12px 0 18px}@media(max-width:560px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fcard{position:relative;display:grid;gap:4px;padding:10px;border-radius:20px;background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh);cursor:pointer;min-width:0;transition:transform .15s,border-color .15s}.fcard:hover{border-color:var(--ac);transform:translateY(-2px)}.fcard b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fcard>span{color:var(--mut);font-size:.82em}
.fmw{position:relative}.fmo{aspect-ratio:1;border-radius:14px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;background:var(--sf2);color:var(--ac)}.fmo.n0{display:grid;place-items:center;grid-template-columns:1fr;grid-template-rows:1fr;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 70%,#fff),var(--ac))}.fmo i{display:block;min-height:0}.fmo.n1 i{grid-column:1/3;grid-row:1/3}.fmo.n2 i{grid-row:1/3}.fmo.n3 i:first-child{grid-row:1/3}.ftag{position:absolute;left:8px;top:8px;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px #fff}

<script>
/* ===== Round 21: Help center, quick tour, diagnostics, Browse tiles, recent searches, premium polish ===== */
const APP_VER='3.0 · October 2026';
Object.assign(I,{help:'M12 17h.01M9.1 9a3 3 0 015.8 1c0 2-3 2.5-3 4M12 22a10 10 0 110-20 10 10 0 010 20z',book:'M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 19a2 2 0 012-2h13'});
const B=(l,a)=>`<button class="btn" data-sa="${a}">${l}</button>`;
const HELP=[
{id:'start',icon:'play',title:'Get started',sum:'Add files, formats, install the app',items:[
{q:'What is this app?',a:'A music and video player that keeps everything on your own device. There is no account and nothing is uploaded. After you install it, it works offline.'},
{q:'How do I add my music and videos?',a:'Use any of these: press <b>Add files</b> (or the + button), drag and drop files anywhere on the page, or press <kbd>Shift</kbd>+<kbd>A</kbd> on a keyboard. In Chrome or Edge on a computer you can also press <b>Add folder</b> so the whole folder is scanned, including subfolders. Phones and iPhones can only add files one by one, because their browsers do not allow folder access.',act:[['Take a quick tour','tour']]},
{q:'Which file types will play?',a:'It depends on your browser and device, because the browser does the decoding. Audio: MP3, AAC/M4A, WAV, FLAC and OGG/Opus play almost everywhere. Video: MP4 and MOV with H.264, and WebM with VP8, VP9 or AV1, play almost everywhere. HEVC (H.265) and some MKV files play only when your device supports them. AC3, DTS, WMA, AVI and WMV usually do not play in browsers. If a file does not play, the app tells you why and the Troubleshooting topic has fixes.'},
{q:'How do I install it as an app?',a:'<b>Android (Chrome):</b> menu ⋮ → Install app (or Add to Home screen). <b>iPhone and iPad (Safari):</b> Share → Add to Home Screen. <b>Windows or Mac (Chrome or Edge):</b> the install icon in the address bar, or menu → Install. Installing gives you a full-screen app, offline use, icon shortcuts and, on Windows 11, widgets.'},
{q:'Do I need internet?',a:'Only for the first load and for sharing files between devices. Playing, the library, the Vault and settings all work offline once the app is installed.'}]},
{id:'music',icon:'music',title:'Playing music',sum:'Queue, equalizer, fades, lyrics',items:[
{q:'How do the player options work?',a:'Under the volume bar are option buttons: <b>Speed, Equalizer, Sleep timer, Lyrics, Subtitles</b> and <b>More</b>. Tap one to see its choices, tap it again (or outside) to close. Speed, Equalizer presets and Sleep timer open a small menu. Lyrics, Subtitles and More open a sheet.'},
{q:'Shuffle, repeat and A–B loop',a:'Shuffle and Repeat (off, all, one) are next to the main play button. For A–B loop open <b>More → Loop</b> or press <kbd>Alt</kbd>+<kbd>L</kbd> three times: first sets A, second sets B and starts the loop, third clears it.'},
{q:'Equalizer and sound',a:'Open <b>Equalizer</b> and pick a preset, or choose <b>Fine-tune sliders</b> for 10 bands, preamp and balance. Volume can go up to <b>200%</b> like VLC (a limiter prevents clipping, so protect your hearing). Volume boost, loudness leveling and ReplayGain are in Settings → Audio.'},
{q:'Crossfade and gapless',a:'Settings → Audio → Crossfade lets you choose Off, Gapless or 2–12 seconds. Albums can stay gapless even when crossfade is on. Crossfade stops when you seek, pause or skip.'},
{q:'Sleep timer',a:'Choose 15, 30 or 60 minutes, or <b>End of this song</b>. The sound fades out gently before it stops.'},
{q:'Lyrics',a:'Put a <b>.lrc</b> file with the same name next to the song when you add it (or load one in the Lyrics sheet). Synced lyrics scroll with the music. Plain text lyrics also work but do not scroll.'},
{q:'Cover art and tags',a:'Titles, artists, albums, track numbers and covers are read from MP3 (ID3), FLAC and M4A files. To set your own cover use <b>⋯ → Set cover image</b>. Videos get a preview picture from a frame of the video.',act:[['Rebuild previews','rebuildprev']]}]},
{id:'video',icon:'film',title:'Playing video',sum:'Gestures, subtitles, speed, 4K and 8K',items:[
{q:'How do video controls work?',a:'Tap a video to open it full screen. Tap the screen to show or hide the controls. The gear opens a list of options such as Speed, Aspect ratio, Picture, Subtitles and Repeat. Each row opens its own page, and the back arrow returns to the list.'},
{q:'Touch gestures',a:'<b>Double-tap</b> left or right to skip back or forward. <b>Swipe</b> sideways to seek. Swipe up or down on the <b>right</b> side for volume and on the <b>left</b> side for brightness. <b>Pinch</b> to zoom and drag to pan. <b>Hold</b> to play at 2× speed. <b>Swipe down</b> to close. The lock button disables all touch until you unlock. Each gesture can be switched off in Settings → Touch gestures.'},
{q:'Subtitles',a:'SRT, VTT and ASS/SSA files work. Files with the same name as the video load automatically. Otherwise open the gear → Subtitles → Load a file. You can change delay, size and position, and move the picture of the subtitles with the keyboard (<kbd>G</kbd> and <kbd>H</kbd> shift timing by 50 ms).'},
{q:'Speed from 0.25× to 4×',a:'Use the gear → Playback speed (a slider plus presets), the option buttons in the music player, or the keys <kbd>[</kbd> <kbd>]</kbd> and <kbd>&lt;</kbd> <kbd>&gt;</kbd>. <kbd>=</kbd> returns to normal. Settings → Playback lets you keep pitch natural at other speeds. An 8× experimental mode is in Settings.'},
{q:'4K, 8K and low quality videos',a:'Playback is as good as your device can decode. 4K and 8K files switch on <b>Performance mode</b> automatically, which turns off blur, seek-bar previews and effects. Very large files in 16K are beyond any phone or browser today. Small, low-resolution videos play fine and can be sharpened in Settings → Playback → Sharpen small videos.'},
{q:'Rotate, aspect ratio and zoom',a:'The rotate button locks landscape or portrait (or auto). Aspect ratio offers Auto, 16:9, 4:3, 21:9 and Stretch. Fit and Fill, brightness and zoom are on the Picture page.'},
{q:'Resume, bookmarks and Picture-in-picture',a:'Videos and songs remember where you stopped. Add a bookmark with <kbd>Shift</kbd>+<kbd>B</kbd> or gear → Bookmarks. Picture-in-picture is the small window button, where your browser supports it.'}]},
{id:'library',icon:'list',title:'Library and playlists',sum:'Organise, search, playlists, history',items:[
{q:'Songs, Albums, Artists, Folders',a:'Open Music and use the chips to switch views. Videos has List, Grid and Folders, plus filters for In progress, New and Favorites. Folders appear for files you added by folder or as Imported files.'},
{q:'Search and sort',a:'Use the search box at the top (press <kbd>/</kbd>). Your last searches are suggested when you tap it. Sort and the reverse button are on each list.'},
{q:'Playlists, favorites and history',a:'Create playlists from the Playlists page or with <b>⋯ → Add to playlist</b>. Export a playlist as M3U8 or import one. The heart marks favorites. <b>Recent</b> shows what you played, grouped by day. Clear history from Recent or Settings; it also resets resume positions and play counts.'},
{q:'Select many, rename, remove',a:'Press <b>Select</b> (or long-press an item) to choose several, then play, queue, add to a playlist, share, move to the Vault or delete. <b>⋯ → Rename</b> changes the title. Removing from the library never deletes the original file on your device.'},
{q:'A file says “Needs file”',a:'The app only keeps a copy of small files (50 MB by default). Larger files stay linked to your device and may need to be picked again after you reopen the app. Choose <b>Relink</b> and select the same file. You can change the limit in Settings → Library and folders → Copy files up to.'}]},
{id:'home',icon:'grid',title:'Home, widgets and shortcuts',sum:'Customize Home, Windows widgets, badges',items:[
{q:'Customize Home',a:'Press <b>Customize Home</b> at the bottom of Home. Switch widgets on or off and move them up or down: Quick actions, Now playing, Continue, Videos, Recently played, Music, Albums, Playlists, Folders, Favorites, New, Browse and Library stats.',act:[['Open Home widgets','homew']]},
{q:'Widgets for the installed app',a:'<b>Windows 11 with Microsoft Edge:</b> install the app, open the Widgets board, press + and add Continue, Recently played or Quick actions. <b>Android and iPhone:</b> web apps cannot create home-screen widgets there, so use the icon shortcuts (press and hold the icon) and the lock-screen controls instead. Widgets never show anything from the Vault.'},
{q:'Icon shortcuts and badge',a:'Press and hold the installed app icon for Continue, Shuffle music, Videos, Music and Share files. The badge shows how many new items you have (Windows, macOS and some Android launchers). Turn it off in Settings → App and help.'},
{q:'Lock-screen and notification controls',a:'While something plays, your phone or computer shows play, pause, next, previous and seek controls with the title and cover. They appear when the app is installed or the page is open in a normal browser tab.'}]},
{id:'vault',icon:'lock',title:'Vault (private files)',sum:'PIN or password, recovery, limits',items:[
{q:'What is the Vault?',a:'A separate, encrypted library. Files are locked with AES-256 using a key protected by your PIN or password, and nothing is uploaded. Moved files disappear from the normal library, playlists and widgets.'},
{q:'Set it up',a:'Open Vault from Home or the menu and choose <b>PIN</b> (4–12 digits) or <b>Password</b> (6 or more characters). You then get a <b>recovery code</b> of 24 characters. Write it down and keep it somewhere safe. It is shown only once.',act:[['Open Vault','vault']]},
{q:'Move files in and out',a:'Use <b>⋯ → Move to Vault</b> on any file. The original on your device stays where it was, so delete it yourself if you want it gone. Inside the Vault, <b>Move out</b> decrypts a copy back into your library.'},
{q:'I forgot my PIN or password',a:'Choose <b>Forgot?</b> and enter the recovery code to set a new one. If both are lost, the only option is <b>Erase</b>, which deletes the Vault contents. There is no back door, by design.'},
{q:'Auto-lock and privacy options',a:'Settings → Vault lets you lock when you leave the page (immediately, 1, 5 or 15 minutes, or never) and hide titles on the lock screen. After five wrong tries the app makes you wait longer each time.'},
{q:'Big files in the Vault',a:'Vault videos are decrypted in memory to play, so very large videos can be slow or fail on phones with little memory. Keep huge videos in the normal library.'}]},
{id:'share',icon:'share',title:'Share files between devices',sum:'QR codes, Wi-Fi, fixes',items:[
{q:'How sharing works',a:'Files go straight from one device to another, with no cloud. On the sending device press <b>Share</b>, pick files and show the QR code. On the receiving device press <b>Receive</b> and scan it. The receiver then shows a reply QR; the sender scans that with <b>Scan reply QR</b>. Both devices must be online and keep the app open until it finishes.',act:[['Open Share','xfer']]},
{q:'No camera or QR does not scan',a:'Allow camera access for the page. If scanning fails, use <b>Copy code</b> or <b>Copy link</b> on one device and paste it on the other. The reply works the same way.'},
{q:'It will not connect',a:'Try switching between <b>Anywhere</b> and <b>Same Wi-Fi</b>. VPNs, school or office networks and some mobile networks block direct connections. Keep both screens on and the app in the foreground. Sending large files over a weak connection can take a while; the screen shows speed and time left.'},
{q:'Where do received files go?',a:'Into your library (or the Vault if it is open). The history list shows what was sent and received. Clear it from the History screen.'}]},
{id:'look',icon:'moon',title:'Look and feel',sum:'Themes, colours, sizes, effects',items:[
{q:'Themes and colours',a:'Settings → Theme and colours has System, Light, Dark, AMOLED, Sepia and Midnight cards, an accent palette with custom colour, text size and list density. The accent can follow the cover of the song that is playing.'},
{q:'Thumbnail size and layout',a:'Thumbnail size (Small, Medium, Large) changes Home and the video grid. Videos can be shown as List or Grid. Home widgets decide what appears on Home.'},
{q:'Visual effects: Lite or Full',a:'Lite removes blur and some animation so video and scrolling stay smooth on phones. Auto uses Lite on Android and low-memory devices. You can pick Full or Lite in Settings → Theme and colours.'},
{q:'Progress line',a:'Change colour, thickness and handle shape of the seek bar, with a live preview, in Settings → Progress line.'}]},
{id:'keys',icon:'keyboard',title:'Keyboard and gestures',sum:'Shortcuts for PC, laptop and tablet',items:[
{q:'Which keyboard shortcuts exist?',a:'Dozens, in the style of VLC, YouTube, MPC-HC and PotPlayer. Space or K plays and pauses, arrows seek and change volume, J and L jump 10 seconds, F is fullscreen, [ ] change speed, A cycles aspect ratio, C or V cycles subtitles. Press <kbd>?</kbd> for the full list.',act:[['Show all shortcuts','keys']]},
{q:'Shortcuts do nothing',a:'Click once on the page so it has focus, make sure no dialog is open, and check Settings → Keyboard is on. Keys such as Ctrl+T and Ctrl+W belong to the browser and cannot be used by web pages.'},
{q:'Phone and tablet controls',a:'On touch screens use the gestures from the Video topic. A Bluetooth keyboard works with the same shortcuts, and headset and media keys control playback.'}]},
{id:'privacy',icon:'info',title:'Privacy, storage and backup',sum:'What is stored, backup and restore',items:[
{q:'What is stored and where?',a:'Everything stays in your browser on this device: your library and copies of small files in IndexedDB, settings in local storage, encrypted Vault files in IndexedDB. Nothing is sent to a server. Sharing uses a direct connection to the other device.'},
{q:'Backup and restore',a:'Settings → Library and folders → Backup saves a JSON file with your library details, playlists, favorites, history, bookmarks and subtitle or lyrics text. It does not contain the media files themselves, so keep your music and videos too. Restore reads that file back.'},
{q:'Storage is full',a:'See the storage bar in Settings → Library and folders. Lower <b>Copy files up to</b>, remove items you do not need, clear history, or remove the library and add files again. Browsers may clear site data when the device is very low on space; installing the app helps prevent that.'},
{q:'Clear or reset',a:'<b>Reset settings</b> restores every option and keeps your library. <b>Clear history</b> removes recent items, resume positions and play counts. <b>Clear library</b> removes the list of files (not the files on your device).',act:[['Reset settings','reset']]}]},
{id:'fix',icon:'help',title:'Troubleshooting',sum:'Solutions to common problems',items:[
{q:'The app freezes or Chrome says “isn’t responding”',a:'1) Settings → Theme and colours → Visual effects → <b>Lite</b>. 2) Do not add hundreds of large videos at once; add them in small groups. 3) Lower Settings → Library → Copy files up to to 25 or 50 MB. 4) Close other tabs and apps. 5) Install the app instead of using it from a downloaded file. 6) If it still happens, copy the diagnostics below and use them when you ask for help.',act:[['Copy diagnostics','diag']]},
{q:'A video plays but there is no picture, or no sound',a:'The file uses a codec your browser cannot decode (often HEVC, AC3 or DTS). Try Chrome or Edge, or convert the video to H.264 video with AAC audio (VLC or HandBrake can do it). Media info (the i button) shows the format and whether the browser supports it.'},
{q:'Playback stutters on 4K or 8K',a:'Make sure Performance mode is Auto or Always (Settings → Playback), set Visual effects to Lite, close other tabs, and avoid speeds above 2×. If the device cannot decode the file smoothly, use a lower-resolution copy.'},
{q:'Preview pictures are missing',a:'Open Settings → Library and folders and press <b>Rebuild</b>. Previews are skipped for very large videos and for files the browser cannot decode. Linked files that need permission get previews after you open them once.',act:[['Rebuild previews','rebuildprev']]},
{q:'Subtitles do not show, are late, or look broken',a:'Use SRT, VTT or ASS files, ideally saved as UTF-8. Name the file exactly like the video to load it automatically. If timing is off use the gear → Subtitles → Delay slider, or <kbd>G</kbd> and <kbd>H</kbd>. Garbled letters usually mean a different text encoding: re-save the file as UTF-8 in any text editor.'},
{q:'Sound is too quiet or too loud',a:'Raise volume above 100% (up to 200%), or turn on Volume boost and Loudness leveling in Settings → Audio. If it is too loud lower Maximum volume there. Check that the device is not muted and the right output is selected.'},
{q:'Lyrics do not show',a:'You need a synced <b>.lrc</b> file with the same name as the song. Add it with the song or load it from the Lyrics sheet.'},
{q:'Files disappear after I reopen the app',a:'Large files are linked, not copied, so they show “Needs file”: use Relink. On Chrome or Edge on a computer, add the folder instead so it is remembered. Private or incognito windows do not keep data.'},
{q:'Sharing will not connect',a:'See the Share files topic: use the paste option, switch between Anywhere and Same Wi-Fi, turn off VPNs, keep both screens awake.'},
{q:'The install button is missing',a:'Use Chrome, Edge or Safari over a secure address. The app may already be installed. On iPhone use Share → Add to Home Screen. Opening the file straight from storage (content:// or file://) cannot be installed; host it or use the installable package.'},
{q:'Lock-screen controls do not appear',a:'Start playback first and keep the app or tab open. Some phones hide controls when battery saver is on. Installed apps behave best.'},
{q:'Gestures clash with the browser',a:'Pull-to-refresh and back swipes belong to the browser. Install the app for a full-screen view, or turn off individual gestures in Settings → Touch gestures. The lock button disables touch while watching.'},
{q:'Everything looks too big or too small',a:'Change Text size and Thumbnail size in Settings → Theme and colours. Very large screens are scaled automatically; browser zoom (Ctrl + / Ctrl −) also works.'},
{q:'Nothing helps',a:'Copy the diagnostics, note what you did and what you expected, and keep a sample file that fails. As a last step use Reset settings, then Clear library and add files again.',act:[['Copy diagnostics','diag'],['Reset settings','reset']]}]},
{id:'about',icon:'book',title:'About and limits',sum:'Version, what it can and cannot do',items:[
{q:'Version',a:'Professional Media Player '+APP_VER+'. Plain HTML, CSS and JavaScript, no tracking and no ads.'},
{q:'What it cannot do',a:'It cannot scan your phone storage automatically (browsers do not allow it), play files your browser cannot decode, make home-screen widgets on Android or iPhone, or use AirPlay or Chromecast yet. A native Android build would add automatic scanning and widgets.'},
{q:'Tips from other great players',a:'Resume where you left off, double-tap to skip, long-press for 2× speed, folders view like MX Player and VLC, cover-tinted Now Playing like Spotify and Apple Music, a persistent mini player, and a Browse grid for quick access.'}]}];
const qa=it=>`<details class="qa"><summary>${it.q}</summary><div class="qaa">${it.a}${it.act?`<div class="qab">${it.act.map(([l,a])=>B(l,a)).join('')}</div>`:''}</div></details>`;

async function diagText(){const est=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate().catch(()=>({})):{};const f=[['IndexedDB',!!window.indexedDB],['Web Audio',!!(window.AudioContext||window.webkitAudioContext)],['Media Session',!!navigator.mediaSession],['Service worker',!!navigator.serviceWorker],['Folder access',!!window.showDirectoryPicker],['Picture in picture',!!document.pictureInPictureEnabled],['Wake lock',!!navigator.wakeLock],['WebRTC',!!window.RTCPeerConnection],['Web Crypto',!!(window.crypto&&crypto.subtle)],['Orientation lock',!!(screen.orientation&&screen.orientation.lock)]];return['Media Player diagnostics','Version '+APP_VER,'Time '+new Date().toISOString(),'Browser '+navigator.userAgent,'Screen '+innerWidth+'x'+innerHeight+' at '+devicePixelRatio+'x','Installed app: '+(standalone()?'yes':'no'),'Lite effects: '+(document.body.classList.contains('lite')?'on':'off'),'Memory '+(navigator.deviceMemory||'?')+' GB, cores '+(navigator.hardwareConcurrency||'?'),'Library: '+items.length+' items ('+items.filter(i=>i.kind==='video').length+' video)','Storage: '+(est.usage?Math.round(est.usage/1048576)+' MB of '+Math.round(est.quota/1048576)+' MB':'unknown'),'Features: '+f.map(x=>x[0]+' '+(x[1]?'yes':'no')).join(', ')].join('\n')}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-sa=diag]');if(!b)return;const t=await diagText();try{await navigator.clipboard.writeText(t);toast('Diagnostics copied')}catch(x){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Diagnostics copied')}catch(y){toast('Could not copy')}a.remove()}});

const TOUR=[['Welcome','Your music and videos, kept on your own device. Nothing is uploaded.','music'],['Add your files','Press Add files, drop files anywhere, or add a whole folder in Chrome or Edge.','plus'],['Make Home yours','Choose widgets, themes and colours. Press Customize Home at the bottom of Home.','gear'],['Watch with gestures','Double-tap to skip, swipe for volume and brightness, pinch to zoom, hold for 2× speed.','film'],['Private and shareable','Lock files in the Vault, or send them to another device with a QR code.','lock'],['Need help?','Settings → Help and support has guides and fixes for everything.','help']];
let tourI=0,tourOn=false;

add('vault','How do I back up and restore my Vault?','Settings → Vault → <b>Back up Vault</b> saves one encrypted <b>.mpvault</b> file with every file, your Vault playlists and the locked key. It is only as private as your PIN, so keep it somewhere safe. To restore on this or another device, choose <b>Restore from backup</b>, pick the file and enter the PIN (or recovery code) of that Vault. Restoring replaces the current Vault.');
